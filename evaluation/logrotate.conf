# Claude Code Evaluation Data Log Rotation
# Run via: logrotate --state ~/.claude/evaluation/data/logrotate.state ~/.claude/evaluation/logrotate.conf
# Anacron: 7 25 logrotate_eval /usr/sbin/logrotate --state ~/.claude/evaluation/data/logrotate.state ~/.claude/evaluation/logrotate.conf

# Core evaluation JSONL files (weekly, OR if > 5M)
/home/user/.claude/evaluation/data/budget_spending.jsonl
/home/user/.claude/evaluation/data/token_usage.jsonl
/home/user/.claude/evaluation/data/cache_events.jsonl
/home/user/.claude/evaluation/data/cot_alerts.jsonl
/home/user/.claude/evaluation/data/agent_metrics.jsonl
/home/user/.claude/evaluation/data/multi_turn_patterns.jsonl
/home/user/.claude/evaluation/data/code_reviews.jsonl
/home/user/.claude/evaluation/data/autonomous_decisions.jsonl
/home/user/.claude/evaluation/data/tool_latency.jsonl
/home/user/.claude/evaluation/data/workflow_gaps.jsonl
/home/user/.claude/evaluation/data/metrics.jsonl
/home/user/.claude/evaluation/data/routing_decisions.jsonl
/home/user/.claude/evaluation/data/usage_limit_alerts.jsonl
/home/user/.claude/evaluation/data/budget_alerts.jsonl
/home/user/.claude/evaluation/data/agent_costs.jsonl
/home/user/.claude/evaluation/data/task_costs.jsonl
/home/user/.claude/evaluation/data/model_routing.jsonl
/home/user/.claude/evaluation/data/agent_task_metrics.jsonl
/home/user/.claude/evaluation/data/context_budget.jsonl
/home/user/.claude/evaluation/data/hook_health.jsonl
/home/user/.claude/evaluation/data/session_continuity.jsonl
/home/user/.claude/evaluation/data/session_evaluations.jsonl
/home/user/.claude/evaluation/data/latency_metrics.jsonl
/home/user/.claude/evaluation/data/hallucination_flags.jsonl
/home/user/.claude/evaluation/data/fact_verification_flags.jsonl
{
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    maxsize 5M
    create 0644 user user
    dateext
    dateformat -%Y%m%d
    copytruncate
    sharedscripts
    postrotate
        # Archive rotated files older than 28 days
        find /home/user/.claude/evaluation/data -maxdepth 1 -name "*.jsonl-????????.gz" -mtime +28 -exec mv {} /home/user/.claude/evaluation/data/archive/ \; 2>/dev/null || true
    endscript
}

