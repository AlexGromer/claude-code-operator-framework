# Tool chains (session-specific, monthly OR if > 5M)
/home/user/.claude/evaluation/data/tool_chains/*.jsonl {
    monthly
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    maxsize 5M
    create 0644 user user
    dateext
    dateformat -%Y%m%d
    copytruncate
    sharedscripts
    postrotate
        # Clean up old session tool chains (keep only last 3 months)
        find /home/user/.claude/evaluation/data/tool_chains -name "*.jsonl-????????.gz" -mtime +90 -delete 2>/dev/null || true
    endscript
}

